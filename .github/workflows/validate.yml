name: Validate Data

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".**"

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bundle data
        run: python .utils/bundle.py

      # The rules live in dwt's `data_check` module, which the site also runs in the browser on a
      # single row. This posts the whole bundle so a release is held to the same rules.
      - name: Run validation
        id: validate
        run: |
          set -o pipefail
          mkdir -p .tmp
          curl -sS --fail-with-body -X POST https://api.dwt.sh/data/validate \
            -H 'Content-Type: application/json' \
            --data-binary @.dist/all.json > .tmp/response.json
          jq -r '.[] | if .row then "\(.row): \(.message)" else .message end' \
            .tmp/response.json > .tmp/errors.txt
          if [ -s .tmp/errors.txt ]; then
            cat .tmp/errors.txt
            exit 1
          fi
          echo "all checks passed"
        continue-on-error: true

      - name: Comment on failure
        if: steps.validate.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.existsSync('.tmp/errors.txt')
              ? fs.readFileSync('.tmp/errors.txt', 'utf8').slice(-2000)
              : 'the validation endpoint could not be reached';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Validation failed:\n\`\`\`\n${output}\n\`\`\``
            });

      - name: Close PR and delete branch
        if: steps.validate.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            if (!pr.data.title.startsWith('[Patch |')) return;
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: 'closed'
            });
            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${pr.data.head.ref}`
            });

      - name: Conditional Fail
        if: steps.validate.outcome == 'failure'
        run: exit 1
